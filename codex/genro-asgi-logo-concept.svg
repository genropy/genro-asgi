<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Genro ASGI — logo concept</title>
  <desc id="desc">A new geometric identity: a continuous G-shaped flow enters a gateway and fans out toward three asynchronous endpoints.</desc>

  <defs>
    <linearGradient id="tile" x1="52" y1="48" x2="340" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111C36"/>
      <stop offset="1" stop-color="#07101F"/>
    </linearGradient>
    <linearGradient id="flow" x1="91" y1="96" x2="294" y2="282" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#56E6D5"/>
      <stop offset="0.52" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="word" x1="734" y1="125" x2="1080" y2="286" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#07101F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- New symbol: application flow -> gateway -> concurrent workers. -->
  <g filter="url(#soft-shadow)">
    <rect x="40" y="40" width="320" height="320" rx="76" fill="url(#tile)"/>
  </g>

  <g fill="none" stroke="url(#flow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- The open loop suggests a lowercase g without using a letterform. -->
    <path d="M251 120C226 91 183 80 147 94C104 110 79 153 86 198C93 248 135 286 186 286C217 286 244 273 263 252"
          stroke-width="29"/>
    <!-- One request crosses the gateway and becomes three independent routes. -->
    <path d="M156 201H202L282 143" stroke-width="22"/>
    <path d="M202 201H291" stroke-width="22"/>
    <path d="M202 201L282 259" stroke-width="22"/>
  </g>

  <!-- Endpoint dots make the fan-out readable even at small sizes. -->
  <circle cx="292" cy="136" r="13" fill="#56E6D5"/>
  <circle cx="303" cy="201" r="13" fill="#3B82F6"/>
  <circle cx="292" cy="266" r="13" fill="#8B5CF6"/>
  <circle cx="202" cy="201" r="10" fill="#F8FAFC"/>

  <!-- Wordmark intentionally separates the project name from its runtime. -->
  <text x="438" y="230"
        fill="#101828"
        font-family="Inter, Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif"
        font-size="126"
        font-weight="720"
        letter-spacing="-6">genro</text>
  <text x="820" y="230"
        fill="url(#word)"
        font-family="Inter, Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif"
        font-size="126"
        font-weight="420"
        letter-spacing="8">asgi</text>

  <g transform="translate(446 277)">
    <rect width="284" height="7" rx="3.5" fill="#D7E1F0"/>
    <rect width="91" height="7" rx="3.5" fill="#56E6D5"/>
    <rect x="96" width="91" height="7" rx="3.5" fill="#3B82F6"/>
    <rect x="192" width="92" height="7" rx="3.5" fill="#8B5CF6"/>
  </g>
</svg>
