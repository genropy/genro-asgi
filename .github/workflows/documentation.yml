name: Documentation

"on":
  pull_request:
    branches: [develop]
    paths:
      - 'docs/**'
      - 'internals/**'
      - '.mkdocs/**'
      - 'mkdocs.yml'
      - '.readthedocs.yaml'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/docs/**'
      - 'tests/test_documentation_recipes.py'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation and test dependencies
        run: python -m pip install -e '.[docs,internals,test]'
      - name: Reader and configuration contracts
        run: python -m pytest tests/docs tests/test_documentation_recipes.py -o addopts=''
      - name: Sphinx HTML with all warnings visible
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
      - name: MkDocs strict build
        run: python -m mkdocs build --strict
      - name: Rendered links and anchors
        run: |
          python .mkdocs/check_links.py docs/_build/html
          python .mkdocs/check_links.py .mkdocs/site
